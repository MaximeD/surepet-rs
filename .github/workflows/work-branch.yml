name: Rust

on:
  push:
    branches-ignore: [ "master" ]


env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: 🧹 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lint
        run: make lint

  tests:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cargo-cache
      - name: tests
        run: make test

  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    needs: [lint, tests]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cargo-cache
      - name: build
        run: make release
